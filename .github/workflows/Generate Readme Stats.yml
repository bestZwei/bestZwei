name: Generate Readme Stats

on:
  schedule:
    # 每天 UTC 0 点（北京时间 8 点）自动更新
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 生成个人统计卡片 (stats)
      - name: Generate Stats Card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          path: generated-stats/overview.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: |
            theme: graywhite
            hide_border: true
            show_icons: true
            include_all_commits: true
            count_private: true

      # 2. 生成常用语言卡片 (top-langs)
      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          path: generated-stats/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: |
            theme: graywhite
            hide_border: true
            layout: compact

      # 3. 提交并推送到仓库
      - name: Commit and Push SVG
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add generated-stats/
          git diff-index --quiet HEAD || git commit -m "chore: update readme stats [skip ci]"
          git push
