name: Generate Readme Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 必须显式声明写权限，解决 403 问题
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 生成个人统计卡片
      - name: Generate Stats Card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          path: generated-stats/overview.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: |
            theme: graywhite
            hide_border: true
            show_icons: true
            include_all_commits: true
            count_private: true

      # 2. 生成常用语言卡片
      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          path: generated-stats/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: |
            theme: graywhite
            hide_border: true
            layout: compact

      # 3. 提交并自动推送
      - name: Commit and Push SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update readme stats [skip ci]"
          file_pattern: 'generated-stats/*.svg'
